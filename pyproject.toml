[project]
name = "hackyeah"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1.0",
    "pydantic-ai-slim[openai]>=1,<2",
    "python-dotenv>=1,<2",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.34,<1.0",
]

[dependency-groups]
data = [
    "osmium>=4.1,<5",
    "shapely>=2.1,<3",
]
dev = [
    "httpx>=0.28,<1",
    "pyright>=1.1.408",
    "ruff>=0.15.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
